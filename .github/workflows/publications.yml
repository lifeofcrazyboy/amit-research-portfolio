name: Update publications and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh public ORCID publications
        id: sync
        continue-on-error: true
        env:
          ORCID_PUBLIC_TOKEN: ${{ secrets.ORCID_PUBLIC_TOKEN }}
        run: python scripts/sync_publications.py
      - name: Report unavailable ORCID service
        if: steps.sync.outcome == 'failure'
        run: echo '::warning::ORCID refresh failed. The saved publication snapshot is being retained. Check the refresh logs and ORCID work visibility.'
      - name: Save refreshed publication snapshot
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publications from public ORCID record'
            git push
          fi
      - name: Prepare public website files
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css app.js _site/
          cp assets/* _site/assets/
          cp data/publications.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
